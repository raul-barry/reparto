name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera la carpeta android/ que falta (el proyecto solo trae lib/, assets/ y pubspec).
      - name: Crear proyecto Android
        run: flutter create --platforms=android --project-name reparto --org com.reparto .

      - name: Permiso de internet y nombre de la app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Reparto"#' "$M"

      - run: flutter pub get

      - name: Generar icono de la app
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - name: Guardar APK como archivo de la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: reparto-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Reparto APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
